# ngfd ffmemless effects for xmsirius (qti-haptics, /dev/input/event*).
# ngfd merges every plugins.d/*ffmemless.ini in name order, later files
# overriding earlier ones, so this overrides ngfd's own 50-ffmemless.ini.
# (NGF_FFMEMLESS_SETTINGS doesn't help: the defaults are uploaded first and
# the first rejected effect aborts the sink before that file is applied.)
#
# qti-haptics only accepts FF_CONSTANT effects (length + level) and FF_PERIODIC
# with FF_CUSTOM predefined effect ids; rumble and periodic sine effects from
# ngfd's default 50-ffmemless.ini fail with EINVAL, which makes the whole
# ffmemless sink (and ngfd) fail to start. Same effect names, timings and
# repeats as the defaults, all as constant effects. LEVEL is 0..32767 and the
# driver scales it against its configured vmax.
[ffmemless]
supported_effects = touch;touch_weak;touch_strong;release;release_weak;release_strong;drag_start;drag_fail;drag_boundary;drag_end;short;strong;long;notice;message;attention;alarm;ringtone

touch_TYPE = constant
touch_DURATION = 40
touch_DELAY = 0
touch_LEVEL = 24000

touch_weak_TYPE = constant
touch_weak_DURATION = 40
touch_weak_DELAY = 0
touch_weak_LEVEL = 18000

touch_strong_TYPE = constant
touch_strong_DURATION = 40
touch_strong_DELAY = 0
touch_strong_LEVEL = 30000

release_TYPE = constant
release_DURATION = 20
release_DELAY = 0
release_LEVEL = 24000

release_weak_TYPE = constant
release_weak_DURATION = 20
release_weak_DELAY = 0
release_weak_LEVEL = 18000

release_strong_TYPE = constant
release_strong_DURATION = 20
release_strong_DELAY = 0
release_strong_LEVEL = 30000

drag_start_TYPE = constant
drag_start_DURATION = 20
drag_start_DELAY = 0
drag_start_LEVEL = 24000

drag_fail_TYPE = constant
drag_fail_DURATION = 25
drag_fail_DELAY = 0
drag_fail_LEVEL = 24000

drag_boundary_TYPE = constant
drag_boundary_DURATION = 30
drag_boundary_DELAY = 0
drag_boundary_LEVEL = 24000

drag_end_TYPE = constant
drag_end_DURATION = 40
drag_end_DELAY = 0
drag_end_LEVEL = 24000

short_TYPE = constant
short_DURATION = 80
short_DELAY = 0
short_LEVEL = 24000

strong_TYPE = constant
strong_DURATION = 80
strong_DELAY = 0
strong_LEVEL = 32767

long_TYPE = constant
long_DURATION = 850
long_DELAY = 0
long_LEVEL = 20000

notice_TYPE = constant
notice_DURATION = 100
notice_REPEAT = 2
notice_DELAY = 500
notice_LEVEL = 28000

message_TYPE = constant
message_DURATION = 240
message_REPEAT = 2
message_DELAY = 140
message_LEVEL = 26000

attention_TYPE = constant
attention_DURATION = 100
attention_REPEAT = 3
attention_DELAY = 100
attention_LEVEL = 28000

alarm_TYPE = constant
alarm_DURATION = 4000
alarm_DELAY = 500
alarm_LEVEL = 16000

ringtone_TYPE = constant
ringtone_DURATION = 2400
ringtone_DELAY = 400
ringtone_LEVEL = 18000
