# Hardware features of the Xiaomi Mi 8 SE (xmsirius).
#
# libssusysinfo (ssu-sysinfo -f) reads /usr/share/csd/settings.d/*hw-settings*.ini;
# Silica/systemsettings DeviceInfo::hasFeature() is based on it. Without this
# file only Suspend and Reboot were reported, so e.g. the status bar hid the
# battery indicator (BatteryStatusIndicator: visible if FeatureBattery).
#
# Format: [features] section with CSD test names and value 1 ("true" is not
# accepted). Most names equal the feature name without "Feature_", but some
# use CSD aliases (checked one by one with ssu-sysinfo -f on the device):
#   AudioMic1/2 = Microphone1/2, BackCameraFlash = BackCameraFlashlight,
#   ECompass = CompassSensor, GSensor = AccelerationSensor, Gyro = GyroSensor,
#   Fingerprint = FingerprintSensor, Key = HardwareKeys, LCD = Display,
#   Backlight = DisplayBacklight, LED = NotificationLED, Touch = TouchScreen,
#   ProxSensor = ProximitySensor, SIM = SIMCardSlot, UsbCharging = USBCharging,
#   UsbOtg = USBOTG, Wifi = WLAN.
# Left out (not present on this device): FmRadio, NFC, SDCard, Hall (cover
# sensor), FrontCameraFlash, StereoLoudspeaker, ButtonBacklight, Headset (no
# 3.5 mm jack), TOH, TouchAuto. AudioPlayback has no CSD name.
[features]
AudioMic1=1
AudioMic2=1
BackCamera=1
BackCameraFlash=1
Backlight=1
Battery=1
Bluetooth=1
BluetoothTethering=1
CellInfo=1
CellularData=1
CellularVoice=1
ECompass=1
Fingerprint=1
FrontCamera=1
GPS=1
GSensor=1
Gyro=1
Key=1
LCD=1
LED=1
LightSensor=1
Loudspeaker=1
ProxSensor=1
Reboot=1
SIM=1
Suspend=1
Touch=1
UsbCharging=1
UsbOtg=1
Vibrator=1
VideoPlayback=1
Wifi=1
